name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,research,web]"
      - run: ruff check src tests scripts
      - run: black --check src tests scripts
      - run: mypy src
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
      - if: runner.os == 'Windows'
        run: python -m pytest
      - run: python scripts/build_exe.py
      - if: runner.os == 'Linux'
        run: ./dist/MarketMood/MarketMood --cli --help
      - if: runner.os == 'Windows'
        run: .\dist\MarketMood\MarketMood.exe --cli --help
