name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,research,web]"
      - run: ruff check src tests scripts
      - run: black --check src tests scripts
      - run: mypy src
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
      - if: runner.os == 'Windows'
        run: python -m pytest
      - run: python scripts/build_exe.py
      - if: runner.os == 'Linux'
        run: ./dist/MarketMood/MarketMood --cli --help
      - if: runner.os == 'Windows'
        run: .\dist\MarketMood\MarketMood.exe --cli --help
